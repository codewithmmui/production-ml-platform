replicaCount: 2
image: {repository: ghcr.io/OWNER/production-ml-platform, tag: latest, pullPolicy: IfNotPresent}
environment: production
resources: {requests: {cpu: 200m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}
autoscaling: {enabled: true, minReplicas: 2, maxReplicas: 10, targetCPUUtilizationPercentage: 70}
redis: {url: "redis://redis:6379/0"}
postgres: {existingSecret: ml-platform-secrets}
monitoring: {enabled: true}
