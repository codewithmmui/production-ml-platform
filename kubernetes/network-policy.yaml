apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ml-api-default-deny, namespace: ml-platform}
spec:
  podSelector: {matchLabels: {app: ml-api}}
  policyTypes: [Ingress, Egress]
  ingress: [{from: [{namespaceSelector: {}}], ports: [{protocol: TCP, port: 8000}]}]
  egress: [{to: [{podSelector: {}}], ports: [{protocol: TCP, port: 5432}, {protocol: TCP, port: 6379}]}, {to: [{namespaceSelector: {}}], ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]}]
