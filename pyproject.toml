[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "production-ml-platform"
version = "1.0.0"
description = "Production-grade customer churn ML platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3", "pandas>=2.2,<3", "numpy>=2.0,<3",
  "scikit-learn>=1.5,<2", "joblib>=1.4,<2", "pandera>=0.21,<1",
  "mlflow-skinny>=3.15,<4", "redis>=5,<7",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
  "prometheus-client>=0.21,<1", "python-json-logger>=3,<4", "pyyaml>=6,<7",
  "scipy>=1.14,<2", "httpx>=0.27,<1"
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "pytest-cov>=7,<8", "ruff>=0.8,<1", "mypy>=1.13,<2", "pandas-stubs>=2.2", "types-PyYAML>=6"]

[project.scripts]
ml-generate = "ml_platform.data.generate:main"
ml-train = "ml_platform.training.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ml_platform"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["ml_platform"]
